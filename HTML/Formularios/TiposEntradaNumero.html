<!DOCTYPE html>
<html>
    <head>
        <title>RSVP</title>
    </head>
    <body>
        <form>
            <h2>RSVP</h2>

            <p>Venha e faça parte do nosso dia especial!</p>
            <br>
            Nome: <input type="text"> <input type="submit">
            <br><br>

            Você vem ?<br>
            <input type="radio" name="enviar"> Sim<br>
            <input type="radio" name="enviar"> Não <br>
            <input type="radio" name="enviar"> Talvez<br>
            <br><br>

            Alguma restrição alimentar ?<br>
            <input type="checkbox" name="restrições" value="vegetariano"> Vegetariano<br>
            <input type="checkbox" name="restrições" value="vegano"> Vegan<br>
            <input type="checkbox" name="restrições" value="gluten"> Sem Gluten<br>
            <input type="checkbox" name="restrições" value="lactose"> Sem Lactose<br>
            <input type="checkbox" name="restrições" value="outros"> Outros<br>
            <br><br>
            <input type="submit" value="Enviar">
        </form>

    </body>

</html>
